name: Desktop Overlay bug
description: Report a reproducible macOS, Windows, Linux, or BLE-helper problem
title: "overlay: "
labels: [bug, overlay]
body:
  - type: markdown
    attributes:
      value: Do not attach pairing records, Bluetooth captures, recovery firmware, credentials, or private device data.
  - type: input
    id: version
    attributes:
      label: KeebWeaver version
      placeholder: v0.2.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Platform and distribution
      description: Windows/Linux are source previews until target-OS runtime qualification; release ZIP and Homebrew apply only after their release gate is live.
      options:
        - macOS source build
        - macOS signed release ZIP
        - macOS Homebrew Cask
        - Windows source preview
        - Linux X11/XWayland source preview
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and toolchain
      placeholder: macOS 15.6 and Swift 6; Windows 11 and .NET SDK; or Linux distribution, desktop/compositor, and .NET SDK
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Overlay mode
      options:
        - Manual layer tabs only
        - BLE automatic layer following
        - BLE pointer-speed control
        - Window, tray, transparency, or click-through behavior
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include expected behavior, actual behavior, and minimal reproduction steps.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Safe verification details
      placeholder: Source/release/Cask version, test or build result, exact left target, available desktop capabilities, and whether any firmware was written
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I have not attached private Bluetooth data, captures, or firmware.
          required: true
        - label: I identified whether this involved a physical device write.
          required: true
