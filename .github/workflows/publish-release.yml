name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag to verify and publish
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-assets:
    name: independently verify every draft asset
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    outputs:
      checksum_digest: ${{ steps.integrity.outputs.checksum_digest }}
      overlay_digest: ${{ steps.integrity.outputs.overlay_digest }}
    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Verify tag, commit, main ancestry, and draft state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
          test "$tag_commit" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit" --jq '.commit.verification.verified')" = true
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tag_commit" origin/main
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
      - name: Download and verify the complete declared asset set
        id: integrity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_dir="$RUNNER_TEMP/keebweaver-release"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" --dir "$release_dir"
          node overlay/packaging/verify-release-assets.mjs "$release_dir"
          node overlay/packaging/macos/verify-manifest.mjs \
            "$release_dir/keebweaver-overlay-macos-universal.zip" \
            "$release_dir/keebweaver-overlay-macos-manifest.json"
          node scripts/verify-uf2.mjs "$release_dir"/*.uf2
          while IFS= read -r -d '' asset; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done < <(find "$release_dir" -maxdepth 1 -type f -print0)
          echo "checksum_digest=$(sha256sum "$release_dir/SHA256SUMS" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "overlay_digest=$(sha256sum "$release_dir/keebweaver-overlay-macos-universal.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  verify-macos:
    name: independently verify the notarized macOS app
    needs: verify-assets
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      checksum_digest: ${{ steps.macos.outputs.checksum_digest }}
      overlay_digest: ${{ steps.macos.outputs.overlay_digest }}
    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Download, extract, and verify the notarized app
        id: macos
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_dir="$RUNNER_TEMP/keebweaver-release"
          extracted_dir="$RUNNER_TEMP/keebweaver-overlay-extracted"
          mkdir -p "$release_dir" "$extracted_dir"
          gh release download "$RELEASE_TAG" --dir "$release_dir"
          node overlay/packaging/verify-release-assets.mjs "$release_dir"
          node overlay/packaging/macos/verify-manifest.mjs \
            "$release_dir/keebweaver-overlay-macos-universal.zip" \
            "$release_dir/keebweaver-overlay-macos-manifest.json"
          ditto -x -k "$release_dir/keebweaver-overlay-macos-universal.zip" "$extracted_dir"
          test "$(find "$extracted_dir" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')" = "1"
          bash overlay/packaging/macos/verify-app.sh \
            "$extracted_dir/KeebWeaver Overlay.app" \
            distribution \
            "arm64 x86_64"
          echo "checksum_digest=$(shasum -a 256 "$release_dir/SHA256SUMS" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "overlay_digest=$(shasum -a 256 "$release_dir/keebweaver-overlay-macos-universal.zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  publish:
    name: publish unchanged independently reviewed release
    needs:
      - verify-assets
      - verify-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Re-verify that the reviewed draft is unchanged
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REVIEWED_CHECKSUM_DIGEST: ${{ needs.verify-assets.outputs.checksum_digest }}
          REVIEWED_MACOS_CHECKSUM_DIGEST: ${{ needs.verify-macos.outputs.checksum_digest }}
          REVIEWED_OVERLAY_DIGEST: ${{ needs.verify-assets.outputs.overlay_digest }}
          REVIEWED_MACOS_OVERLAY_DIGEST: ${{ needs.verify-macos.outputs.overlay_digest }}
        run: |
          test "$REVIEWED_CHECKSUM_DIGEST" = "$REVIEWED_MACOS_CHECKSUM_DIGEST"
          test "$REVIEWED_OVERLAY_DIGEST" = "$REVIEWED_MACOS_OVERLAY_DIGEST"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
          test "$tag_commit" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit" --jq '.commit.verification.verified')" = true

          release_dir="$RUNNER_TEMP/keebweaver-release"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" --dir "$release_dir"
          node overlay/packaging/verify-release-assets.mjs "$release_dir"
          node overlay/packaging/macos/verify-manifest.mjs \
            "$release_dir/keebweaver-overlay-macos-universal.zip" \
            "$release_dir/keebweaver-overlay-macos-manifest.json"
          node scripts/verify-uf2.mjs "$release_dir"/*.uf2
          test "$(sha256sum "$release_dir/SHA256SUMS" | awk '{print $1}')" = "$REVIEWED_CHECKSUM_DIGEST"
          test "$(sha256sum "$release_dir/keebweaver-overlay-macos-universal.zip" | awk '{print $1}')" = "$REVIEWED_OVERLAY_DIGEST"
          while IFS= read -r -d '' asset; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done < <(find "$release_dir" -maxdepth 1 -type f -print0)
      - name: Publish the reviewed release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          : "${GH_TOKEN:?Missing RELEASE_PUBLISH_TOKEN}"
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
          gh release edit "$RELEASE_TAG" --draft=false
