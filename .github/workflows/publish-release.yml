name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed release tag to verify and publish
        required: true
        type: string

permissions:
  contents: write
  attestations: read

jobs:
  publish:
    name: verify and publish immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out signed tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Verify tag, commit, main ancestry, and draft state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
          test "$tag_commit" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit" --jq '.commit.verification.verified')" = true
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tag_commit" origin/main
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" = true
      - name: Download and independently verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          release_dir="$RUNNER_TEMP/keebweaver-release"
          mkdir -p "$release_dir"
          gh release download "$RELEASE_TAG" --dir "$release_dir"
          (cd "$release_dir" && sha256sum -c SHA256SUMS)
          node scripts/verify-uf2.mjs "$release_dir"/*.uf2
          for asset in "$release_dir"/*; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish the reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false
