name: Firmware build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "scripts/verify-uf2.mjs"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: detect firmware changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.scope.outputs.firmware }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Determine whether a firmware build is required
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            firmware scripts/verify-uf2.mjs package.json package-lock.json .github/workflows/firmware.yml; then
            echo "firmware=false" >> "$GITHUB_OUTPUT"
          else
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    name: build verified UF2 artifacts
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:firmware
      - name: Upload verified firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keebweaver-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            firmware/artifacts/keebweaver-*.uf2
            firmware/artifacts/build-manifest.txt
            firmware/artifacts/SHA256SUMS

  firmware-gate:
    name: firmware-gate
    needs: [changes, firmware]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the scoped firmware result
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          FIRMWARE_REQUIRED: ${{ needs.changes.outputs.firmware }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        run: |
          test "$CHANGE_RESULT" = "success"
          if [[ "$FIRMWARE_REQUIRED" = "true" ]]; then
            test "$FIRMWARE_RESULT" = "success"
          fi
