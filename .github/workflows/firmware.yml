name: Firmware build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "scripts/verify-uf2.mjs"
      - "scripts/create-firmware-sbom.mjs"
      - "scripts/create-license-bundle.mjs"
      - "LICENSES/**"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: detect firmware changes
    runs-on: ubuntu-latest
    outputs:
      firmware: ${{ steps.scope.outputs.firmware }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine whether a firmware build is required
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            firmware scripts/verify-uf2.mjs scripts/create-firmware-sbom.mjs \
            scripts/create-license-bundle.mjs LICENSES THIRD_PARTY_NOTICES.md \
            package.json package-lock.json .github/workflows/firmware.yml; then
            echo "firmware=false" >> "$GITHUB_OUTPUT"
          else
            echo "firmware=true" >> "$GITHUB_OUTPUT"
          fi

  firmware:
    name: build verified UF2 artifacts
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:firmware
      - name: Upload verified firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keebweaver-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            firmware/artifacts/keebweaver-*.uf2
            firmware/artifacts/build-manifest.txt
            firmware/artifacts/SHA256SUMS
            firmware/artifacts/spdx/

  firmware-gate:
    name: firmware-gate
    needs: [changes, firmware]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the scoped firmware result
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          FIRMWARE_REQUIRED: ${{ needs.changes.outputs.firmware }}
          FIRMWARE_RESULT: ${{ needs.firmware.result }}
        run: |
          test "$CHANGE_RESULT" = "success"
          if [[ "$FIRMWARE_REQUIRED" = "true" ]]; then
            test "$FIRMWARE_RESULT" = "success"
          fi
