name: Firmware build

on:
  pull_request:
    branches: [main]
    paths:
      - "firmware/**"
      - "scripts/verify-uf2.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/firmware.yml"
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "scripts/verify-uf2.mjs"
      - ".github/workflows/firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:firmware
      - name: Upload verified firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keebweaver-firmware-${{ github.sha }}
          if-no-files-found: error
          path: |
            firmware/artifacts/keebweaver-*.uf2
            firmware/artifacts/build-manifest.txt
            firmware/artifacts/SHA256SUMS
