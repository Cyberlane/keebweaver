name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Require a GitHub-verified signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')
          test "$verified" = true
      - run: npm ci
      - run: npm run check
      - run: npm run build:firmware
      - name: Create web dependency SBOM
        run: npm sbom --sbom-format spdx > firmware/artifacts/keebweaver-web.spdx.json
      - name: Attest firmware binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: firmware/artifacts/keebweaver-*.uf2
      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keebweaver-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            firmware/artifacts/keebweaver-*.uf2
            firmware/artifacts/build-manifest.txt
            firmware/artifacts/SHA256SUMS
            firmware/artifacts/keebweaver-web.spdx.json
      - name: Create immutable-ready draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
              --title "KeebWeaver $GITHUB_REF_NAME"
          fi
      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$GITHUB_REF_NAME"
          firmware/artifacts/keebweaver-ergokeeb-corne-left.uf2
          firmware/artifacts/keebweaver-ergokeeb-corne-right.uf2
          firmware/artifacts/keebweaver-ergokeeb-corne-settings-reset.uf2
          firmware/artifacts/build-manifest.txt
          firmware/artifacts/SHA256SUMS
          firmware/artifacts/keebweaver-web.spdx.json
          --clobber
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
