name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-overlay:
    name: build signed and notarized macOS Overlay
    runs-on: macos-15
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - name: Require tag and package versions to agree
        run: npm run check:release
      - name: Require a GitHub-verified signed tag before using signing credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')" = true
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
          test "$tag_commit" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit" --jq '.commit.verification.verified')" = true
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tag_commit" origin/main
      - name: Test Overlay package
        run: swift test --package-path overlay/macos/KeebWeaverOverlay
      - name: Import the Developer ID Application identity
        id: signing
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARYTOOL_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARYTOOL_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARYTOOL_ISSUER_ID }}
        run: |
          : "${CERTIFICATE_P12_BASE64:?Missing MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64}"
          : "${CERTIFICATE_PASSWORD:?Missing MACOS_DEVELOPER_ID_APPLICATION_PASSWORD}"
          : "${SIGNING_IDENTITY:?Missing MACOS_DEVELOPER_ID_APPLICATION_IDENTITY}"
          : "${NOTARY_KEY_P8_BASE64:?Missing MACOS_NOTARYTOOL_KEY_P8_BASE64}"
          : "${NOTARY_KEY_ID:?Missing MACOS_NOTARYTOOL_KEY_ID}"
          : "${NOTARY_ISSUER_ID:?Missing MACOS_NOTARYTOOL_ISSUER_ID}"

          umask 077
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          notary_key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          keychain_path="$RUNNER_TEMP/keebweaver-signing.keychain-db"
          keychain_password="$(uuidgen)$(uuidgen)"
          echo "::add-mask::$keychain_password"

          printf '%s' "$CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate_path"
          printf '%s' "$NOTARY_KEY_P8_BASE64" | /usr/bin/base64 -D > "$notary_key_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path" | grep -F "\"$SIGNING_IDENTITY\""

          echo "keychain_path=$keychain_path" >> "$GITHUB_OUTPUT"
          echo "notary_key_path=$notary_key_path" >> "$GITHUB_OUTPUT"
      - name: Build and sign the universal app
        env:
          KEEBWEAVER_BUILD_ARCHS: arm64 x86_64
          KEEBWEAVER_BUILD_NUMBER: ${{ github.run_number }}
          KEEBWEAVER_CODESIGN_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_IDENTITY }}
          KEEBWEAVER_SIGNING_MODE: distribution
        run: bash overlay/macos/KeebWeaverOverlay/build-app.sh
      - name: Submit the signed app for notarization and staple the ticket
        env:
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARYTOOL_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARYTOOL_ISSUER_ID }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key_path }}
        run: |
          app="dist/overlay/macos/KeebWeaver Overlay.app"
          submission="$RUNNER_TEMP/keebweaver-overlay-notarization.zip"
          ditto -c -k --keepParent --sequesterRsrc "$app" "$submission"
          xcrun notarytool submit "$submission" \
            --key "$NOTARY_KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --timeout 20m \
            --output-format json > "$RUNNER_TEMP/notary-result.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/notary-result.json"
          xcrun stapler staple "$app"
      - name: Verify and package the notarized distribution
        run: |
          app="dist/overlay/macos/KeebWeaver Overlay.app"
          archive="dist/overlay/macos/keebweaver-overlay-macos-universal.zip"
          bash overlay/packaging/macos/package-release.sh "$app" "dist/overlay/macos"
          node overlay/packaging/macos/create-manifest.mjs \
            "$app" \
            "$archive" \
            "dist/overlay/macos/keebweaver-overlay-macos-manifest.json"
          node overlay/packaging/macos/verify-manifest.mjs \
            "$archive" \
            "dist/overlay/macos/keebweaver-overlay-macos-manifest.json"
      - name: Upload notarized Overlay release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keebweaver-overlay-macos-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/overlay/macos/keebweaver-overlay-macos-universal.zip
            dist/overlay/macos/keebweaver-overlay-macos-manifest.json
      - name: Remove the temporary signing keychain and credentials
        if: always()
        env:
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain_path }}
          NOTARY_KEY_PATH: ${{ steps.signing.outputs.notary_key_path }}
        run: |
          if [[ -n "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
          if [[ -n "$NOTARY_KEY_PATH" ]]; then
            rm -f "$NOTARY_KEY_PATH"
          fi
          rm -f "$RUNNER_TEMP/developer-id-application.p12"

  release:
    name: build attested draft release
    needs: macos-overlay
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - name: Require a GitHub-verified signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.sha')
          verified=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.verification.verified')
          test "$verified" = true
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')
          test "$tag_commit" = "$(git rev-parse HEAD)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag_commit" --jq '.commit.verification.verified')" = true
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$tag_commit" origin/main
      - run: npm ci
      - run: npm run check
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run build:firmware
      - name: Require a clean tagged firmware source tree
        run: grep -Fx 'project_dirty=false' firmware/artifacts/build-manifest.txt
      - name: Create web dependency SBOM
        run: npm sbom --sbom-format spdx > firmware/artifacts/keebweaver-web.spdx.json
      - name: Create firmware dependency SBOM
        run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" npm run --silent sbom:firmware > firmware/artifacts/keebweaver-firmware-dependencies.spdx.json
      - name: Package file-level firmware SPDX documents
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cd firmware/artifacts
          test "$(find spdx -type f -name '*.spdx' | wc -l)" -eq 9
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - spdx \
            | gzip -n > keebweaver-firmware-file-level-spdx.tar.gz
          rm -rf spdx
      - name: Create redistributed license bundle
        run: npm run --silent licenses:bundle > firmware/artifacts/keebweaver-license-notices.txt
      - name: Download notarized Overlay release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: keebweaver-overlay-macos-${{ github.run_id }}
          path: firmware/artifacts
      - name: Create and verify complete release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          node overlay/packaging/create-release-metadata.mjs firmware/artifacts
          node overlay/packaging/verify-release-assets.mjs firmware/artifacts
          node scripts/verify-uf2.mjs firmware/artifacts/*.uf2
      - name: Attest every declared release asset
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: firmware/artifacts/*
      - name: Upload complete workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keebweaver-${{ github.ref_name }}
          if-no-files-found: error
          path: firmware/artifacts/*
      - name: Create immutable-ready draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes \
              --title "KeebWeaver $GITHUB_REF_NAME"
          fi
      - name: Attach every declared release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(node overlay/packaging/verify-release-assets.mjs firmware/artifacts --list)
          asset_paths=()
          for asset in "${assets[@]}"; do
            asset_paths+=("firmware/artifacts/$asset")
          done
          gh release upload "$GITHUB_REF_NAME" "${asset_paths[@]}" --clobber
      - name: Leave the release draft for independent review
        run: echo "Draft $GITHUB_REF_NAME is ready for the manual Publish release workflow." >> "$GITHUB_STEP_SUMMARY"
