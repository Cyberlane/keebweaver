# The source-correlated ErgoKeeb defaults are kept intentionally. The custom
# behavior lives in ergokeeb_corne.keymap; both halves use this same base.
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_SLEEP=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_BT_DEVICE_NAME="ErgoKeeb Corne"
CONFIG_ZMK_KEYBOARD_NAME="ErgoKeeb Corne"
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# USB-updatable display art is enabled automatically for nice!view builds. Its
# module selects the required USB/serial/font options; settings-reset builds do
# not expose an inactive artwork port.
# The firmware module supplies a replacement custom screen with persistent
# artwork plus the active-layer label.
# CONFIG_NICE_VIEW_WIDGET_STATUS is not set
